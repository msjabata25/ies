# Netlify build for the React + Vite site (it used to be a Next.js app).
# Settings here override the ones saved in the Netlify dashboard.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Vite 8 needs Node ^20.19 or >=22.12
  NODE_VERSION = "22"
  # The Next.js runtime plugin was added automatically when this was a Next.js
  # site; this tells it to stand down. Also remove it in the dashboard
  # (Site configuration → Build & deploy → Build plugins) if it's listed there.
  NETLIFY_NEXT_PLUGIN_SKIP = "true"

# Single-page app: let React Router handle every path (e.g. /about, /apply on refresh)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
