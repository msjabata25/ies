<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>IES JUST Student Chapter</title>
    <meta name="description" content="Industrial Electronics Society — JUST Student Chapter" />
    <meta name="theme-color" content="#0A0A0A" />
    <meta property="og:title" content="IES JUST Student Chapter" />
    <meta property="og:description" content="Industrial Electronics Society — JUST Student Chapter" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="IES JUST" />
    <meta name="twitter:card" content="summary" />
    <!-- og:image, og:url and <link rel="canonical"> are left out until the production domain is known. -->
    <link rel="icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <script>
      /* Restore light mode before first paint so there's no dark flash (Navbar.jsx owns the toggle) */
      try {
        if (localStorage.getItem('ies-light') === '1') {
          document.documentElement.classList.add('light-mode');
          var m = document.querySelector('meta[name="theme-color"]');
          if (m) m.setAttribute('content', '#F7F5F0');
        }
      } catch (e) {}
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Sora:wght@100..800&family=Space+Mono:wght@400;700&family=Lalezar&family=IBM+Plex+Sans+Arabic:wght@400;500;700&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=block" rel="stylesheet" />
  </head>
  <body class="bg-surface text-fg antialiased min-h-screen selection:bg-primary selection:text-surface">
    <div class="fixed inset-0 pointer-events-none z-[-1] bg-grid"></div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
